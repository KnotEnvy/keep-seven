<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The name and the description are here, not only in the script: the tab during the load and a link pasted into a
     chat or a post show them. Both are copies of design/story.json (ui.ui_title, system.page_description):
     tests/core/pageHead.spec.ts holds them equal. The share picture is public/share.jpg (tools/make_share_image.mjs);
     its address is relative so the page works under any sub-path, and vite.config.mts makes it absolute when the build is
     told the site's address (SITE_URL, set by .github/workflows/pages.yml). -->
<title>KEEP SEVEN</title>
<meta name="description" content="A weird-west gunslinger shooter that runs in the browser. One stage, one heavy six-shot revolver, and a seventh round that is not for firing.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KEEP SEVEN">
<meta property="og:title" content="KEEP SEVEN">
<meta property="og:description" content="A weird-west gunslinger shooter that runs in the browser. One stage, one heavy six-shot revolver, and a seventh round that is not for firing.">
<meta property="og:image" content="./share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The title screen of KEEP SEVEN: a revolver held out under a red rock overhang, a shaft of evening sun on the sand.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#14110f">
<!-- the icon is inline: a page served from a sub-path must not ask the host's root for /favicon.ico -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314110f'/%3E%3Cg fill='%23c9a14a'%3E%3Ccircle cx='16.0' cy='7.0' r='2.6'/%3E%3Ccircle cx='23.8' cy='11.5' r='2.6'/%3E%3Ccircle cx='23.8' cy='20.5' r='2.6'/%3E%3Ccircle cx='16.0' cy='25.0' r='2.6'/%3E%3Ccircle cx='8.2' cy='20.5' r='2.6'/%3E%3Ccircle cx='8.2' cy='11.5' r='2.6'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23e8dcc4'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; background: #000; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  /* The wait for the script on a cold cache (ruling R15; pass i1, UI team): the game's name and its six-and-one mark on
     ink, exactly where the loading screen and then the title have them (src/ui/ui.css `.title-head`, `.load-foot`: the
     same lengths), and a dim brass line with a pale glint crossing it where the loading bar will be. Nothing moves
     when the script takes over: the picture arrives round the name. It is taken away by the inline script below, the
     moment the game has put its own first screen (or its one line of failure) into #ui. */
  #preload { position: fixed; inset: 0; overflow: hidden; background: #14110f; color: #e9e2d0; pointer-events: none; --u: min(calc(100vh / 1080), calc(100vw / 1440)); }
  /* pass i3 (UI team): the title frame, out of focus and dim, behind the name: the share picture (72 kB), set by the
     inline script below once it has arrived, by its relative address. The loading screen draws the same (ui.css `.load-bg`). */
  #preload .bg { position: absolute; inset: -32% -4vh -6% -4vh; background-size: cover; background-position: 50% 50%; filter: blur(1.3vh) brightness(0.42) saturate(0.9); opacity: 0; transition: opacity 0.9s ease-out; }
  #preload .bg.in { opacity: 1; }
  #preload .head { position: absolute; left: 7%; top: 11%; }
  #preload .name { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif; font-weight: normal; font-size: min(calc(var(--u) * 84), 7vw); letter-spacing: 0.3em; line-height: 1; white-space: nowrap; }
  #preload svg { display: block; overflow: visible; height: max(calc(var(--u) * 56), 52px); width: max(calc(var(--u) * 36.4), 33.8px); margin: calc(var(--u) * 26) 0 calc(var(--u) * 16) calc(var(--u) * 4); fill: #c9a14a; }
  /* pass i2: one line of the game's voice under the mark (the loading screen's `.load-says`: the same words, from design/story.json) */
  #preload .says { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif; font-style: italic; font-size: max(14px, calc(var(--u) * 24)); line-height: 1.3; opacity: 0.88; white-space: nowrap; }
  #preload .line { position: absolute; left: calc(7% + var(--u) * 24); bottom: 13%; overflow: hidden; width: max(180px, calc(min(calc(var(--u) * 84), 7vw) * 9.72 - var(--u) * 24)); height: max(2px, calc(var(--u) * 2)); background: #6e5a2e; }
  #preload .line::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 16%; background: #e9e2d0; opacity: 0.5; animation: preload 1.5s ease-in-out infinite; }
  @keyframes preload { from { transform: translateX(-110%); } to { transform: translateX(640%); } }
  /* pass i2: a frame narrower than 3:2 has the lit camp behind the menu's place: the column stands lower (ui.css) */
  /* pass i4 (UI): in a frame narrower than 3:2 the left column stands at 3.5 % (src/ui/ui.css has the same rule for the loading screen and the title) */
  @media (max-aspect-ratio: 3/2) { #preload .head { left: 3.5%; } #preload .line { left: calc(3.5% + var(--u) * 24); bottom: 5.5%; } }
  @media (prefers-reduced-motion: reduce) { #preload .line::after { animation: none; display: none; } #preload .bg { transition: none; } }
  /* Pass i4 (ruling R20, robustness). Two things this page says by itself, before or instead of the game; the words are
     copies of design/story.json `system` (tests/core/pageHead.spec.ts holds them equal). `#pre-note`: a visitor with no
     mouse (a phone, a tablet) or a browser without pointer lock is told so under the name, with one button, BEFORE the
     models and textures are asked for (src/main.ts waits on window.__keep7Gate). The same box carries the line of a script
     or a style that did not come, with a button that reloads, and the line of a slow connection. */
  #pre-note { position: fixed; left: 7%; right: 7%; top: calc(11% + max(190px, min(calc(100vh / 1080), calc(100vw / 1440)) * 250)); z-index: 2000; max-width: 34em; color: #e9e2d0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif; font-size: max(17px, min(2.4vh, 2.6vw)); line-height: 1.45;
    -webkit-user-select: text; user-select: text; text-shadow: 0 1px 3px #14110f, 0 0 14px #14110f; }
  #pre-note.over { top: 0; left: 0; right: 0; bottom: 0; max-width: none; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8vmin; text-align: center; background: rgba(20, 17, 15, 0.94); }
  #pre-note p { margin: 0 0 1em 0; }
  #pre-note button { font: inherit; color: #14110f; background: #c9a14a; border: 0; border-radius: 2px; padding: 0.5em 1.1em; cursor: pointer; letter-spacing: 0.04em; }
  #pre-note button:focus-visible { outline: 2px solid #e9e2d0; outline-offset: 3px; }
  noscript p { position: fixed; left: 7%; right: 7%; bottom: 20%; z-index: 2000; margin: 0; color: #e9e2d0; font: 18px/1.5 Georgia, serif; }
</style>
</head>
<body>
<noscript><p>KEEP SEVEN needs JavaScript. Turn it on for this page and reload.</p></noscript>
<canvas id="game" tabindex="0"></canvas>
<div id="ui"></div>
<div id="preload" aria-hidden="true">
  <div class="bg"></div>
  <div class="head">
    <div class="name">KEEP SEVEN</div>
    <svg viewBox="-12.2 -10.86 24.4 37.5"><line x1="0" y1="0" x2="0" y2="21" stroke="#c9a14a" stroke-width="0.8"/><circle cx="5" cy="-8.66" r="2.2"/><circle cx="10" cy="0" r="2.2"/><circle cx="5" cy="8.66" r="2.2"/><circle cx="-5" cy="8.66" r="2.2"/><circle cx="-10" cy="0" r="2.2"/><circle cx="-5" cy="-8.66" r="2.2"/><circle cx="0" cy="23.8" r="2.8"/></svg>
    <div class="says">The court is gone. The Rule leans.</div>
  </div>
  <div class="line"></div>
</div>
<script>
  // the pre-boot page stands until the game draws into #ui (its loading screen, or the one line of a failed boot)
  (function () {
    var pre = document.getElementById('preload'), ui = document.getElementById('ui');
    // the backdrop: shown when it has arrived whole (the address is relative: the site lives under a sub-path)
    var bg = pre && pre.querySelector('.bg');
    if (bg && typeof Image === 'function') {
      var picture = new Image();
      picture.onload = function () { bg.style.backgroundImage = 'url(./share.jpg)'; bg.className = 'bg in'; };
      picture.src = './share.jpg';
    }
    // ---- pass i4: what this page says by itself (the words are design/story.json `system`: needs_input, load_anyway,
    // page_failed, page_reload, page_slow) -------------------------------------------------------------------------
    var SAYS = {
      needs_input: 'KEEP SEVEN needs a mouse and a keyboard. Open it on a computer.',
      load_anyway: 'Load it anyway',
      page_failed: 'It would not load. Reload the page.',
      page_reload: 'Reload',
      page_slow: 'Still waiting on the connection.'
    };
    var booted = false, failed = false, gated = false;
    function note(kind, text, button, act) {
      var el = document.getElementById('pre-note');
      if (!el) { el = document.createElement('div'); el.id = 'pre-note'; document.body.appendChild(el); }
      el.className = kind === 'failed' ? 'over' : '';
      el.setAttribute('data-kind', kind);
      el.setAttribute('role', kind === 'slow' ? 'status' : 'alert');
      el.textContent = '';
      var p = document.createElement('p');
      p.textContent = text;
      el.appendChild(p);
      if (button) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = button;
        b.addEventListener('click', act);
        el.appendChild(b);
      }
      return el;
    }
    function unnote(kind) { var el = document.getElementById('pre-note'); if (el && (!kind || el.getAttribute('data-kind') === kind)) el.remove(); }
    var line = pre && pre.querySelector('.line');
    // (1) ruling R20: no mouse, or no pointer lock. The game's files are not asked for until the visitor says so.
    function noMouse() {
      try {
        if (/[?&]test=1(&|$)/.test(location.search)) return false;            // a stepped test page (no release build reads it)
        var fine = typeof window.matchMedia !== 'function' || window.matchMedia('(any-pointer: fine)').matches;
        return !fine || !('requestPointerLock' in Element.prototype);
      } catch (e) { return false; }
    }
    if (noMouse()) {
      gated = true;
      document.documentElement.setAttribute('data-input', 'touch');
      if (line) line.style.visibility = 'hidden';
      window.__keep7Gate = new Promise(function (resolve) {
        note('input', SAYS.needs_input, SAYS.load_anyway, function () { gated = false; unnote('input'); if (line) line.style.visibility = ''; started = Date.now(); resolve(); });
      });
    }
    // (2) the script or the style did not come (a cached page that names a file a newer release has removed, a dropped
    // connection): the moving line read as "still loading" for ever, and a game without its style drew every screen at once
    function fail() {
      if (failed) return;
      failed = true;
      if (line) line.style.visibility = 'hidden';
      note('failed', SAYS.page_failed, SAYS.page_reload, function () { location.reload(); });
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (!t || t === window || !t.tagName) return;
      if ((t.tagName === 'SCRIPT' && t.src) || (t.tagName === 'LINK' && /stylesheet/i.test(t.rel || ''))) fail();
    }, true);
    // (3) the script is slow in coming: say so after 20 s (the line keeps moving; when the script arrives the game takes over)
    var started = Date.now();
    var slow = setInterval(function () {
      if (booted || failed) { clearInterval(slow); return; }
      if (!gated && Date.now() - started >= 20000 && !document.getElementById('pre-note')) note('slow', SAYS.page_slow);
    }, 1000);
    function taken() { booted = true; if (!failed) unnote(); if (pre) pre.remove(); }
    if (!pre || !ui || typeof MutationObserver !== 'function') { taken(); return; }
    var seen = new MutationObserver(function () { seen.disconnect(); taken(); });
    seen.observe(ui, { childList: true });
  })();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
