# Checks every push to main; publishes the game to GitHub Pages when a version tag
# (v*) is pushed or when the workflow is run by hand from the Actions tab.
#
# One-time setup in the repository: Settings -> Pages -> Source: "GitHub Actions".
name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      skip_release_check:
        description: "Publish without the browser check of the built site (only if the check itself is what fails on the runner)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # typecheck, validators and unit tests take about a minute; the browser check of the built site two or three
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run test:unit
      # The built assets in public/assets are committed, so no Blender is needed here.
      - run: npm run build
        env:
          # where the page will live: link previews want an absolute address for the share picture (vite.config.mts)
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # A link pasted into a chat shows the picture only when its address is absolute: do not publish a page without it.
      - name: The share picture has an absolute address
        run: |
          grep -q '<meta property="og:image" content="https://' dist/index.html
          grep -q '<meta name="twitter:image" content="https://' dist/index.html
          test -s dist/share.jpg
      # The site as built, served from a sub-path as Pages serves it, booted cold in a headless browser and walked for a
      # moment by real input (tools/release_check.mjs): no console error, no request outside the sub-path, none failed,
      # no debug hook, every asset asked for with the build's version. A broken sub-path build is not published.
      - name: Browser for the release check
        if: ${{ !inputs.skip_release_check }}
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: The built site boots from a sub-path
        if: ${{ !inputs.skip_release_check }}
        run: node tools/release_check.mjs --dist dist --sub /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Publishing is deliberate: a version tag or a manual run, never an ordinary push.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
