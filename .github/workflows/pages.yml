# Checks every push to main; publishes the game to GitHub Pages when a version tag
# (v*) is pushed or when the workflow is run by hand from the Actions tab.
#
# One-time setup in the repository: Settings -> Pages -> Source: "GitHub Actions".
name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run test:unit
      # The built assets in public/assets are committed, so no Blender is needed here.
      - run: npm run build
        env:
          # where the page will live: link previews want an absolute address for the share picture (vite.config.mts)
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # A link pasted into a chat shows the picture only when its address is absolute: do not publish a page without it.
      - name: The share picture has an absolute address
        run: |
          grep -q '<meta property="og:image" content="https://' dist/index.html
          grep -q '<meta name="twitter:image" content="https://' dist/index.html
          test -s dist/share.jpg
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Publishing is deliberate: a version tag or a manual run, never an ordinary push.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
